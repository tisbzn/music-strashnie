<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>БОСЯТСКИЙ ПЛЕЙЛИСТ</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        .playlist { list-style: none; padding: 0; max-width: 400px; margin: 20px auto; }
        .playlist li { padding: 10px; background: #222; margin: 5px; cursor: pointer; border-radius: 5px; }
        .playlist li.active { background: #1db954; color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <h2>БОСЯТСКИЙ ПЛЕЙЛИСТ</h2>
    
    <!-- Сам плеер -->
    <audio id="audioPlayer" controls autoplay></audio>

    <!-- Список ваших треков с GitHub -->
    <ul class="playlist" id="playlist">
        <li class="active" data-src="https://github.com/tisbzn/music-strashnie/raw/refs/heads/main/%D0%9B%D0%B5%CC%88%D1%88%D0%B0%20%D0%94%D0%B6%D0%B5%D0%B8%CC%86%20feat.%20Adam%20Jamar%20-%20%D0%94%D0%B0%D0%B2%D1%8F%D1%82%20%D0%BD%D0%B8%D0%B7%D0%B0.mp3">СТРАШНАЯ ПЕСНЯ 1</li>
        <li data-src="https://github.com/tisbzn/music-strashnie2/raw/refs/heads/main/%D0%9B%D0%B5%D1%88%D0%B0%20%D0%94%D0%B6%D0%B5%D0%B9%20-%20%D0%93%D1%80%D0%BE%D0%BC%D0%BA%D0%B0%D1%8F%20%D0%9B%D0%B0%D0%B4%D0%B0%20(low%20bass%20by%20DryunyA).mp3">НАИСТРАШНЕЙЩАЯ 2</li>
       

    <script>
        const audio = document.getElementById('audioPlayer');
        const playlist = document.getElementById('playlist');
        const tracks = playlist.getElementsByTagName('li');
        let currentTrack = 0;

        function loadTrack(index) {
            for(let i=0; i<tracks.length; i++) tracks[i].classList.remove('active');
            tracks[index].classList.add('active');
            audio.src = tracks[index].getAttribute('data-src');
            audio.play();
        }

        // Запуск первого трека при загрузке
        audio.src = tracks[currentTrack].getAttribute('data-src');

        // Главная магия: когда трек кончается, включается следующий
        audio.addEventListener('ended', function() {
            currentTrack++;
            if (currentTrack >= tracks.length) {
                currentTrack = 0; // Вернуться к первому треку, когда список кончился
            }
            loadTrack(currentTrack);
        });

        // Клик по треку в списке для ручного переключения
        for(let i=0; i<tracks.length; i++) {
            tracks[i].addEventListener('click', function() {
                currentTrack = i;
                loadTrack(currentTrack);
            });
        }
    </script>
</body>
</html>
